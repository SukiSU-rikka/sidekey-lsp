plugins { id 'com.android.application' }

android {
    namespace 'com.sidekey.lsp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sidekey.lsp'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        fixed {
            storeFile file('sidekey.jks')
            storePassword 'sidekey'
            keyAlias 'sidekey'
            keyPassword 'sidekey'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug { signingConfig signingConfigs.fixed }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
